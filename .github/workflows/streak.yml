name: Update streak heatmap

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 15 * * *"   # 매일 KST 00:05 (스트릭 끊김 반영)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    # 봇 자신의 커밋으로 무한 루프 방지
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 이력 필요

      - name: Generate heatmap SVG
        run: python3 .github/scripts/streak_heatmap.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet || git commit -m "chore: update streak heatmap [skip ci]"
          git push
