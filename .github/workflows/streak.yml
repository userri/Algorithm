name: Update streak heatmap

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 15 * * *"   # 매일 KST 00:05 (스트릭 끊김 반영)
  workflow_dispatch:

permissions:
  contents: write

# 백준허브/LeetHub는 문제 하나에 커밋을 3~4개 연달아 민다.
# 그러면 런이 동시에 떠서 같은 streak 브랜치에 force-push 하다 ref 잠금 충돌로 죽는다.
#   ! [remote rejected] cannot lock ref 'refs/heads/streak'
# 히트맵은 전체 git log 로 매번 새로 그리므로 마지막 런 하나만 살리면 된다.
concurrency:
  group: streak-publish
  cancel-in-progress: true

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git log 전체 이력 필요

      - name: Generate heatmap SVG
        run: python3 .github/scripts/streak_heatmap.py

      # SVG는 main이 아니라 별도 'streak' 브랜치에 단일 커밋으로 force-push.
      # 기본 브랜치가 아니므로 GitHub 기여 잔디에 봇 커밋이 잡히지 않는다.
      - name: Publish to orphan streak branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out && cp assets/streak.svg /tmp/out/streak.svg
          git checkout --orphan streak
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf assets && mkdir -p assets
          cp /tmp/out/streak.svg assets/streak.svg
          git add assets/streak.svg
          git commit -m "streak heatmap [skip ci]"
          git push -f origin streak
