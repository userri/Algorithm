name: Organize LeetCode folders

# LeetHub v2가 레포 루트에 만드는 "1882-process-tasks-using-servers" 형태의
# 폴더를 LeetCode/ 아래로 모아준다. (LeetHub에는 경로 지정 옵션이 없음)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 연속 푸시로 런이 겹치면 서로 밀어내며 실패한다. 여기선 폴더를 실제로 옮기므로
# 중간에 취소하면 어중간한 상태가 남는다 → 취소 대신 한 줄로 세워 순서대로 돌린다.
concurrency:
  group: organize-leetcode
  cancel-in-progress: false

jobs:
  organize:
    # 봇 자신의 커밋에는 반응하지 않음 (무한 루프 방지)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move LeetHub folders into LeetCode/
        run: |
          shopt -s nullglob
          for dir in [0-9]*-*/; do
            name="${dir%/}"
            mkdir -p LeetCode
            rm -rf "LeetCode/$name"      # 같은 문제 재업로드 시 최신본으로 교체
            mv "$name" "LeetCode/"
            echo "moved: $name"
          done

      - name: Fix LeetCode Topics links in README
        run: |
          # LeetHub는 링크를 tree/main/1882-... 로 쓴다 → tree/main/LeetCode/1882-... 로 교정
          # 이미 LeetCode/ 가 붙은 링크는 패턴에 안 걸려서 중복 적용되지 않음
          if [ -f README.md ]; then
            sed -i 's|tree/main/\([0-9][0-9]*-\)|tree/main/LeetCode/\1|g' README.md
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: LeetCode 폴더/링크 정리 [skip ci]"
          git push
